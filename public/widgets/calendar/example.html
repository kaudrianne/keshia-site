<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example widget</title>
<style>
  body { margin: 0; font: 14px Inter, system-ui, sans-serif; color: #1a1f22; background: #fff; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #181c1f; color: #ecebe7; } }
  .row { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 10px; margin: 8px 0; }
  .bar { height: 18px; border-radius: 4px; background: #c2553a; transition: opacity .2s; }
  .row:hover .bar { opacity: .7; }
  .note { color: #8a9396; font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
  <!-- PLACEHOLDER. Replace this whole file with a chart exported from R, e.g.
       htmlwidgets::saveWidget(my_plot, "public/widgets/calendar/chart1.html", selfcontained = TRUE) -->
  <div id="chart"></div>
  <p class="note">Placeholder chart with made-up numbers. Replace with your exported R widget.</p>
<script>
  const data = [["Classes",34],["Studying",22],["Friends",18],["Work",14],["Coffee",12]];
  const max = Math.max(...data.map(d => d[1]));
  document.getElementById('chart').innerHTML = data.map(([k,v]) =>
    `<div class="row" title="${k}: ${v}%"><span>${k}</span><div class="bar" style="width:${v/max*100}%"></div><span>${v}%</span></div>`
  ).join('');
</script>
</body>
</html>
